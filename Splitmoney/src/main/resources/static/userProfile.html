<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Home</title>
<link
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
	rel="stylesheet">
<style>
.user-card {
	background-color: #ffffff;
	border-radius: 12px;
	padding: 25px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.user-card h3 {
	color: #4f4f4f;
}

.user-card p {
	color: #666;
}

.btn-back {
	background-color: #007bff;
	color: white;
	border: none;
	border-radius: 5px;
	padding: 10px 20px;
	margin-top: 20px;
}

.btn-back:hover {
	background-color: #0056b3;
}

.profile-img {
	border-radius: 50%;
	width: 150px;
	height: 150px;
	object-fit: cover;
}
</style>
</head>
<body>

	<header>
		<nav class="navbar navbar-expand-sm shadow"
			style="padding-left: 190px; padding-right: 200px;">
			<div class="container-fluid">
				<a class="navbar-brand" href="index.html"> <img
					src="images/QuickSplitLogo Header WhiteBack.png" alt="logo"
					class="img-fluid" style="height: 75px;">
				</a>
				<div class="d-flex align-items-center gap-3">
					<a id="profileSection"></a>
				</div>
			</div>
		</nav>
	</header>
	<div class="container my-5">
		<div class="user-card mx-auto" style="max-width: 600px;">
			<h3 class="text-center mb-4">
				Welcome, <span id="userName"></span>
			</h3>
			<div class="text-center">
				<img id="userImage" class="profile-img mb-3"
					src="images/default-profile.png" alt="Profile Picture">
			</div>
			<div id="userDetails"></div>
			<button class="btn-back btn-block"
				onclick="window.location.href='userHome.html'">Return to
				Home</button>
		</div>
	</div>

	<script>
        document.addEventListener("DOMContentLoaded", function() {
            const user = JSON.parse(localStorage.getItem("user"));
            if (user) {
                document.getElementById("userName").textContent = `${user.firstName} ${user.lastName}`;
                document.getElementById("userImage").src = user.picture ? `data:image/png;base64,${user.picture}` : 'images/default-profile.png';
                
                document.getElementById("userDetails").innerHTML = `
                    <p><strong>ID:</strong> ${user.id}</p>
                    <p><strong>Name:</strong> ${user.firstName} ${user.lastName}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Phone:</strong> ${user.phone || "N/A"}</p>
                    <p><strong>Account Created:</strong> ${new Date(user.createdDate).toLocaleString()}</p>
                `;
            } else {
                document.getElementById("userDetails").innerHTML = "<p>User details not found. Please log in again.</p>";
            }
        });
    </script>
</body>
</html>
