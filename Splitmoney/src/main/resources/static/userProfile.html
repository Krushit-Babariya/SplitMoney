<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Welcome to Your Home Page</h2>
        <div id="userDetails" class="mt-3"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const user = JSON.parse(localStorage.getItem("user"));
            if (user) {
                document.getElementById("userDetails").innerHTML = `
                    <p><strong>ID:</strong> ${user.id}</p>
                    <p><strong>First Name:</strong> ${user.firstName}</p>
                    <p><strong>Last Name:</strong> ${user.lastName}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Password:</strong> ${user.password}</p>
                    <p><strong>Phone:</strong> ${user.phone || "N/A"}</p>
                    <p><strong>Custom Picture:</strong> ${user.customPicture ? "Yes" : "No"}</p>
                    <p><strong>Locale:</strong> ${user.locale}</p>
                    <p><strong>Active:</strong> ${user.active ? "Yes" : "No"}</p>
                    <p><strong>Created Date:</strong> ${new Date(user.createdDate).toLocaleString()}</p>
                    <p><strong>Updated Date:</strong> ${new Date(user.updateDate).toLocaleString()}</p>
                    ${user.picture ? `<img src="data:image/png;base64,${user.picture}" alt="Profile Picture" style="max-width:150px;"/>` : ''}
                `;
            } else {
                document.getElementById("userDetails").innerHTML = "<p>User details not found. Please log in again.</p>";
            }
        });
    </script>
</body>
</html>
